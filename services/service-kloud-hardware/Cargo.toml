[package]
name = "service-kloud-hardware"
version = "1.0.0"
edition = "2021"
authors = ["UltraThinking Infrastructure Team <infra@ultrathinking.com>"]
description = "Real RISC-V hardware management service"

[dependencies]
# Web framework
actix-web = "4.5"
actix-rt = "2.9"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
deadpool-postgres = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Configuration
config = "0.14"
dotenv = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# RISC-V hardware interfaces
libc = "0.2"
nix = { version = "0.28", features = ["ioctl"] }

# Hardware monitoring
sysinfo = "0.30"
procfs = "0.16"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.7", features = ["serde", "v4"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Environment
envy = "0.4"

[dev-dependencies]
actix-web-test = "0.1"
